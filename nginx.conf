# Cloud Run sends traffic to port 8080. Gupt has no backend: nginx only serves the built files.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript image/svg+xml text/plain application/json;

    # Content-Security-Policy (with connect-src 'none' and frame-ancestors 'none'), nosniff,
    # Referrer-Policy, Permissions-Policy, COOP. Generated at build time; see Dockerfile.
    include /etc/nginx/security-headers.conf;

    # Vite puts a content hash in every asset name, so these can be cached for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The page itself is always revalidated, so a new deploy shows up immediately.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
