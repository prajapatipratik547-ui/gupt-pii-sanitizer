name: CI & Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run coverage
      - run: npm run build
      - name: Verify the CSP made it into the build
        run: grep -q "connect-src 'none'" dist/index.html
      - name: End-to-end tests in headless Chrome
        run: |
          npx vite preview --host 127.0.0.1 --port 4317 --strictPort &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4317/ > /dev/null && break; sleep 1; done
          npm run e2e
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  container:
    name: Cloud Run container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker build -t gupt .
      - run: docker run -d --rm -p 8080:8080 --name gupt gupt
      - name: Verify HTTP security headers
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/ > /dev/null && break; sleep 1; done
          curl -sI http://127.0.0.1:8080/ | tee headers.txt
          grep -qi "^content-security-policy: .*connect-src 'none'.*frame-ancestors 'none'" headers.txt
          grep -qi "^x-content-type-options: nosniff" headers.txt
          grep -qi "^referrer-policy: no-referrer" headers.txt
          grep -qi "^cross-origin-opener-policy: same-origin" headers.txt
          ! grep -qi "^server: nginx/" headers.txt
      - name: End-to-end tests against the container
        run: node scripts/e2e.mjs http://127.0.0.1:8080/

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
